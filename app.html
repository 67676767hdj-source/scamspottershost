<style>
/* Layout: one calm column, a shield that fills as you score, big tap targets, no timers. */
:root{
  --scale:1;
  --paper:#EEF3F7; --card:#FFFFFF; --ink:#0E2233; --muted:#46586A; --line:#C3D0DB;
  --brand:#0A5A86; --on-brand:#FFFFFF; --bubble:#E8F1F8;
  --good:#17703A; --good-tint:#E3F4E9; --bad:#A8281F; --bad-tint:#FBE7E4; --gold:#9A6200;
  --display:'Bitter','Noto Sans SC',Georgia,serif;
  --body:'Atkinson Hyperlegible','Noto Sans SC','PingFang SC','Microsoft YaHei','Segoe UI',system-ui,sans-serif;
  font-size:calc(20px * var(--scale));
}
:root[lang="zh-Hans"]{
  --display:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  --body:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0B151E; --card:#13222E; --ink:#E8F0F6; --muted:#A3B6C5; --line:#2A3E4E;
    --brand:#6CC1F0; --on-brand:#05202F; --bubble:#1A2E3D;
    --good:#6FD695; --good-tint:#12301F; --bad:#FF9B91; --bad-tint:#3A1916; --gold:#F0B84A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0B151E; --card:#13222E; --ink:#E8F0F6; --muted:#A3B6C5; --line:#2A3E4E;
  --brand:#6CC1F0; --on-brand:#05202F; --bubble:#1A2E3D;
  --good:#6FD695; --good-tint:#12301F; --bad:#FF9B91; --bad-tint:#3A1916; --gold:#F0B84A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--body); font-size:1rem; line-height:1.5;
  padding-block:12px 40px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.wrap{max-width:46rem; margin:0 auto; display:flex; flex-direction:column; gap:1rem}
h1,h2,h3{font-family:var(--display); line-height:1.2; margin:0; text-wrap:balance}
h1{font-size:clamp(2rem,8vw,2.9rem); font-weight:800}
h2{font-size:1.5rem; font-weight:800}
h3{font-size:1.2rem; font-weight:700}
h4{margin:0; font-size:.8rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
p{margin:0}
ul{margin:0; padding-left:1.2rem; display:flex; flex-direction:column; gap:.25rem}
:focus-visible{outline:3px solid var(--brand); outline-offset:3px}
[tabindex="-1"]:focus{outline:none}

/* top bar */
.top{display:flex; flex-wrap:wrap; align-items:center; gap:.6rem 1rem; justify-content:space-between}
.brand{display:flex; align-items:center; gap:.6rem; font-family:var(--display); font-weight:800; font-size:1.1rem}
.brand svg{width:2rem; height:2.4rem; flex:none}
.stats{display:flex; align-items:center; gap:.5rem; flex-wrap:wrap}
.chip{border:1.5px solid var(--line); background:var(--card); border-radius:999px; padding:.15rem .8rem; font-weight:700; font-size:.9rem; font-variant-numeric:tabular-nums; white-space:nowrap}
.chip.streak{border-color:var(--gold); color:var(--gold)}
.size{display:flex; gap:.3rem}
.size button{min-width:2.6rem; min-height:2.6rem; padding:0 .5rem; border-radius:10px; border:1.5px solid var(--line); background:var(--card); color:var(--ink); font:700 .95rem var(--body); cursor:pointer}
.size button:hover{border-color:var(--brand)}
.size button[aria-pressed="true"]{background:var(--brand); border-color:var(--brand); color:var(--on-brand)}

/* shield */
.s-bg{fill:var(--line)} .s-fill{fill:var(--brand); transition:transform .7s ease}
.s-ln{fill:none; stroke:var(--brand); stroke-width:2.5; stroke-linejoin:round}

.card{background:var(--card); border:1.5px solid var(--line); border-radius:16px; padding:1.1rem; display:flex; flex-direction:column; gap:.9rem}
.lead{font-size:1.15rem}
.muted{color:var(--muted)}

/* start */
.hero{display:grid; grid-template-columns:1fr auto; gap:1rem 1.5rem; align-items:center}
.hero .art{width:7rem}
@media (max-width:30rem){.hero{grid-template-columns:1fr}.hero .art{width:5rem;order:-1}}
.points{list-style:none; padding:0; gap:.7rem}
.points li{display:flex; gap:.7rem; align-items:baseline}
.points b{font-family:var(--display)}
.points .dot{flex:none; width:.7rem; height:.7rem; border-radius:50%; background:var(--brand); transform:translateY(.05rem)}

/* buttons */
.btn{min-height:3.4rem; padding:.65rem 1.5rem; border-radius:14px; border:2px solid var(--brand); background:var(--brand); color:var(--on-brand); font:700 1.1rem var(--body); cursor:pointer; align-self:flex-start}
.btn:hover{filter:brightness(1.08)}
.btn.alt{background:transparent; color:var(--brand)}
.btn.alt[aria-pressed="true"]{background:var(--brand); color:var(--on-brand)}
.btn[disabled]{opacity:.5; cursor:default}
.row{display:flex; flex-wrap:wrap; gap:.7rem}
.judge{display:grid; grid-template-columns:repeat(auto-fit,minmax(12rem,1fr)); gap:.8rem}
.judge .btn{align-self:stretch; min-height:4rem; font-size:1.2rem; background:var(--card); color:var(--ink); border-color:var(--ink)}
.judge .btn:hover{background:var(--bubble)}

/* progress */
.meta{display:flex; justify-content:space-between; flex-wrap:wrap; gap:.3rem; font-weight:700}
.prog{display:flex; gap:6px}
.prog span{flex:1; height:.55rem; border-radius:6px; background:var(--line)}
.prog .done{background:var(--brand)} .prog .now{background:var(--gold)}

/* message bubble */
.bubble{background:var(--bubble); border:1.5px solid var(--line); border-radius:6px 20px 20px 20px; padding:.9rem 1rem; display:flex; flex-direction:column; gap:.5rem}
.bubble .who{display:flex; flex-wrap:wrap; gap:.4rem .7rem; align-items:center; font-size:.9rem; color:var(--muted); font-weight:700}
.pill{border:1.5px solid var(--muted); border-radius:999px; padding:0 .6rem; font-size:.75rem; letter-spacing:.04em; text-transform:uppercase}
.bubble .msg{font-size:1.1rem}

/* feedback */
.fb{border-radius:16px; padding:1rem 1.1rem; display:flex; flex-direction:column; gap:.7rem; border:2px solid}
.fb.ok{background:var(--good-tint); border-color:var(--good)}
.fb.no{background:var(--bad-tint); border-color:var(--bad)}
.fb h3{display:flex; flex-wrap:wrap; gap:.3rem .8rem; align-items:baseline}
.fb.ok h3{color:var(--good)} .fb.no h3{color:var(--bad)}
.fb .pts{font-family:var(--body); font-size:.95rem; color:var(--ink)}

/* choices (round 3) */
.opts{display:flex; flex-direction:column; gap:.7rem}
.opt{display:flex; gap:.8rem; align-items:flex-start; text-align:left; width:100%; min-height:3.6rem; padding:.7rem .9rem; border-radius:14px; border:2px solid var(--line); background:var(--card); color:var(--ink); font:400 1.05rem/1.4 var(--body); cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--brand)}
.opt .ltr{flex:none; width:2.1rem; height:2.1rem; border-radius:50%; border:2px solid currentColor; display:grid; place-items:center; font-weight:700}
.opt .txt{display:flex; flex-direction:column; gap:.25rem; min-width:0}
.opt[disabled]{cursor:default}
.opt.best{border-color:var(--good); background:var(--good-tint)}
.opt.wrong{border-color:var(--bad); background:var(--bad-tint)}
.tag{font-size:.8rem; font-weight:700; letter-spacing:.04em; text-transform:uppercase}
.best .tag{color:var(--good)} .wrong .tag{color:var(--bad)}

/* red flag lines (round 2) */
.lines{display:flex; flex-direction:column; gap:.6rem}
.line{display:flex; gap:.8rem; align-items:flex-start; text-align:left; width:100%; min-height:3.4rem; padding:.7rem .9rem; border-radius:14px; border:2px solid var(--line); background:var(--card); color:var(--ink); font:400 1.05rem/1.4 var(--body); cursor:pointer}
.line .box{flex:none; width:1.6rem; height:1.6rem; border:2px solid var(--muted); border-radius:6px; display:grid; place-items:center; font-weight:700; font-size:1rem; margin-top:.1rem}
.line[aria-checked="true"]{border-color:var(--brand); background:var(--bubble)}
.line[aria-checked="true"] .box{background:var(--brand); border-color:var(--brand); color:var(--on-brand)}
.line .txt{display:flex; flex-direction:column; gap:.25rem; min-width:0}
.line.rflag{border-color:var(--bad); background:var(--bad-tint)}
.line.rsafe{border-color:var(--good); background:var(--good-tint)}
.line.rflag .tag{color:var(--bad)} .line.rsafe .tag{color:var(--good)}
.line[disabled]{cursor:default}

/* mini games */
.status{display:flex; flex-wrap:wrap; gap:.5rem}
.gmsg{min-height:1.6rem; font-weight:700}
.mcols{display:grid; grid-template-columns:1fr 1fr; gap:.7rem}
.mcol{display:flex; flex-direction:column; gap:.7rem; min-width:0}
.mt{width:100%; min-height:4.2rem; padding:.6rem .7rem; border-radius:14px; border:2px solid var(--line); background:var(--card); color:var(--ink); font:700 1rem/1.35 var(--body); cursor:pointer; text-align:left; display:flex; flex-direction:column; gap:.15rem; overflow-wrap:anywhere}
.mt:hover:not([disabled]){border-color:var(--brand)}
.mt.sel{border-color:var(--brand); background:var(--bubble); outline:3px solid var(--brand); outline-offset:-5px}
.mt.done{border-color:var(--good); background:var(--good-tint); cursor:default}
.mt .ok{font-size:.8rem; color:var(--good)}
.cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(8.2rem,1fr)); gap:.7rem}
.fc{min-height:6.2rem; padding:.6rem; border-radius:14px; border:2px solid var(--brand); background:var(--brand); color:var(--on-brand); font:700 1rem/1.3 var(--body); cursor:pointer; display:grid; place-items:center; text-align:center; overflow-wrap:anywhere}
.fc .q{font-family:var(--display); font-size:2rem}
.fc.up{background:var(--bubble); color:var(--ink); border-color:var(--brand)}
.fc.up.b{background:var(--card); border-style:dashed}
.fc.done{background:var(--good-tint); color:var(--ink); border-color:var(--good); cursor:default}
.fc .ok{font-size:.8rem; color:var(--good); display:block}

/* round end + results */
.stars{display:flex; gap:.3rem}
.stars svg{width:2.4rem; height:2.4rem}
.star-on{fill:var(--gold)} .star-off{fill:var(--line)}
.big{font-family:var(--display); font-weight:800; font-size:2.2rem; font-variant-numeric:tabular-nums}
.rank{display:grid; grid-template-columns:auto 1fr; gap:1rem 1.4rem; align-items:center}
.rank svg{width:6rem}
@media (max-width:30rem){.rank{grid-template-columns:1fr}.rank svg{width:5rem}}
.badges{display:grid; grid-template-columns:repeat(auto-fit,minmax(10.5rem,1fr)); gap:.7rem}
.badge{border:2px solid var(--line); border-radius:14px; padding:.8rem; display:flex; flex-direction:column; gap:.2rem; background:var(--card)}
.badge.on{border-color:var(--gold)}
.badge.off{opacity:.75}
.badge b{font-family:var(--display)}
.badge .st{font-size:.85rem; font-weight:700}
.badge.on .st{color:var(--gold)}
.rules{display:grid; grid-template-columns:repeat(auto-fit,minmax(12rem,1fr)); gap:.7rem}
.rule{border:1.5px solid var(--line); border-radius:14px; padding:.9rem; display:flex; flex-direction:column; gap:.3rem; background:var(--card)}
.rule b{font-family:var(--display); font-size:1.5rem; letter-spacing:.04em; color:var(--brand)}
.help{background:var(--bubble); border:1.5px solid var(--brand); border-radius:16px; padding:1rem 1.1rem; display:flex; flex-direction:column; gap:.6rem}
.num{font-family:var(--display); font-weight:800; font-size:2rem; font-variant-numeric:tabular-nums; letter-spacing:.02em}
a{color:var(--brand); font-weight:700}

@media (prefers-reduced-motion: reduce){ .s-fill{transition:none} html{scroll-behavior:auto} }
</style>

/* ---------- state ---------- */
var S;
function fresh(){
  if(S && S.g && S.g.timer){ clearTimeout(S.g.timer); }
  S = {screen:"start", round:0, idx:0, score:0, streak:0, bestStreak:0, rs:[0,0,0],
       answered:false, picks:[], res:null, missed:[], g:null, bonusDone:[false,false]};
}
fresh();

var app = document.getElementById("app");
var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function shuffle(a){ a = a.slice(); for(var i=a.length-1;i>0;i--){ var j = Math.floor(Math.random()*(i+1)); var x = a[i]; a[i] = a[j]; a[j] = x; } return a; }

/* ---------- header ---------- */
function updateHeader(){
  document.getElementById("meterRect").style.transform = "translateY(" + (48 - 48*Math.min(1,S.score/MAXPTS)) + "px)";
  document.getElementById("scoreChip").textContent = t("pts", S.score);
  var sc = document.getElementById("streakChip");
  if(S.streak >= 2){ sc.hidden = false; sc.textContent = t("streak", S.streak); } else { sc.hidden = true; }
  document.getElementById("brandName").textContent = t("brand");
  document.getElementById("langGrp").setAttribute("aria-label", t("langAria"));
  document.getElementById("btnSmaller").setAttribute("aria-label", t("smaller"));
  document.getElementById("btnLarger").setAttribute("aria-label", t("larger"));
  var lb = document.querySelectorAll("#langGrp button");
  for(var i=0;i<lb.length;i++){ lb[i].setAttribute("aria-pressed", String(i === li)); }
}
function shieldBig(p, id){
  return '<svg viewBox="0 0 40 48" aria-hidden="true"><defs><clipPath id="'+id+'"><path d="'+SHIELD+'"/></clipPath></defs>' +
    '<path class="s-bg" d="'+SHIELD+'"/>' +
    '<rect class="s-fill big-fill" x="0" y="0" width="40" height="48" clip-path="url(#'+id+')" style="transform:translateY(48px)" data-p="'+p+'"/>' +
    '<path class="s-ln" d="'+SHIELD+'"/></svg>';
}
function animateBig(){
  var els = document.querySelectorAll(".big-fill");
  setTimeout(function(){
    for(var i=0;i<els.length;i++){ els[i].style.transform = "translateY(" + (48 - 48*parseFloat(els[i].getAttribute("data-p"))) + "px)"; }
  }, 60);
}

/* ---------- screens ---------- */
function progress(){
  var r = ROUNDS[S.round], n = r.items.length, h = '<div class="prog" aria-hidden="true">';
  for(var i=0;i<n;i++){ h += '<span class="'+(i<S.idx?'done':(i===S.idx?'now':''))+'"></span>'; }
  return h + '</div><div class="meta"><span>'+esc(t("roundName", S.round+1, L(r.name)))+'</span><span>'+esc(t("qOf", S.idx+1, n))+'</span></div>';
}
function whoRow(it){
  return '<div class="who"><span class="pill">'+esc(L(it.ch))+'</span><span>'+esc(t("from", L(it.from)))+'</span></div>';
}
function langRow(){
  var names = ["English","中文","Bahasa Melayu"], h = '<div class="row" role="group" aria-label="'+esc(t("chooseLang"))+'">';
  for(var i=0;i<3;i++){ h += '<button type="button" class="btn alt" lang="'+LANGS[i]+'" data-act="lang" data-v="'+i+'" aria-pressed="'+(i===li)+'">'+names[i]+'</button>'; }
  return h + '</div>';
}

function viewStart(){
  return '<section class="card" aria-labelledby="mh"><div class="hero"><div class="art">'+shieldBig(1,"cpHero")+'</div><div style="display:flex;flex-direction:column;gap:.8rem">' +
    '<h1 id="mh" tabindex="-1">'+esc(t("brand"))+'</h1><p class="lead">'+esc(t("lead"))+'</p></div></div>' +
    '<h4>'+esc(t("chooseLang"))+'</h4>' + langRow() +
    '<ul class="points">' +
    [1,2,3,4].map(function(n){ return '<li><span class="dot"></span><span><b>'+esc(t("s"+n+"b"))+'</b> '+esc(t("s"+n+"t"))+'</span></li>'; }).join("") + '</ul>' +
    '<button class="btn" type="button" data-act="begin">'+esc(t("startBtn"))+'</button></section>';
}

function viewIntro(){
  var r = ROUNDS[S.round];
  return '<section class="card"><h4>'+esc(t("roundOf", S.round+1))+'</h4><h2 id="mh" tabindex="-1">'+esc(L(r.name))+'</h2><p class="lead">'+esc(L(r.intro))+'</p>' +
    '<button class="btn" type="button" data-act="go">'+esc(t("startRound", S.round+1))+'</button></section>';
}

function nextBtn(){
  var r = ROUNDS[S.round], last = S.idx >= r.items.length-1;
  return '<button class="btn" type="button" data-act="next">'+esc(t(last?"finishRound":"nextQ"))+'</button>';
}

function viewJudge(){
  var it = ROUNDS[0].items[S.idx], h = '<section class="card" aria-labelledby="mh">' + progress();
  h += '<h2 id="mh" tabindex="-1">'+esc(t("judgeQ"))+'</h2><div class="bubble">'+whoRow(it)+'<p class="msg">'+esc(L(it.text))+'</p></div>';
  if(!S.answered){
    h += '<div class="judge"><button class="btn" type="button" data-act="judge" data-v="real">'+esc(t("btnReal"))+'</button>' +
         '<button class="btn" type="button" data-act="judge" data-v="scam">'+esc(t("btnScam"))+'</button></div>';
  } else {
    var ok = S.res.ok, scam = it.answer === "scam";
    h += '<div class="fb '+(ok?'ok':'no')+'" role="status"><h3 id="fbh" tabindex="-1">'+esc(t(ok?"correct":"nq1"))+' <span class="pts">'+esc(t("plus", ok?10:0))+'</span></h3>' +
      '<p><b>'+esc(t(scam?"isScam":"isReal"))+'</b> '+esc(t(S.res.pick==="scam"?"saidScam":"saidReal"))+'</p><p>'+esc(L(it.why))+'</p>' +
      '<h4>'+esc(t(scam?"redFlags":"goodSigns"))+'</h4><ul>'+L(it.points).map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul></div>' + nextBtn();
  }
  return h + '</section>';
}

function viewFlags(){
  var it = ROUNDS[1].items[S.idx], h = '<section class="card" aria-labelledby="mh">' + progress();
  h += '<h2 id="mh" tabindex="-1">'+esc(t("flagsH"))+'</h2><div class="bubble">'+whoRow(it)+'</div>';
  h += '<div class="lines" role="group" aria-label="'+esc(t("linesAria"))+'">';
  it.lines.forEach(function(l,i){
    var on = S.picks.indexOf(i) > -1, cls = "line", extra = "";
    if(S.answered){
      cls += l.f ? " rflag" : " rsafe";
      var tag = l.f ? t(on ? "tFlagSpot" : "tFlagMiss") : t(on ? "tSafeWrong" : "tSafeOk");
      extra = '<span class="tag">'+esc(tag)+'</span><span class="muted">'+esc(L(l.why))+'</span>';
    }
    h += '<button type="button" class="'+cls+'" role="checkbox" aria-checked="'+on+'" data-act="toggle" data-i="'+i+'"'+(S.answered?' disabled':'')+'>' +
      '<span class="box" aria-hidden="true">'+(on?'✔':'')+'</span><span class="txt"><span>'+esc(L(l.t))+'</span>'+extra+'</span></button>';
  });
  h += '</div>';
  if(!S.answered){
    h += '<p class="muted">'+esc(t("flagsHint"))+'</p><button class="btn" type="button" data-act="check">'+esc(t("checkBtn"))+'</button>';
  } else {
    var r = S.res, ok = r.pts >= 15;
    h += '<div class="fb '+(ok?'ok':'no')+'" role="status"><h3 id="fbh" tabindex="-1">'+esc(t(ok?"wellSpotted":"goodStart"))+' <span class="pts">'+esc(t("plus", r.pts))+'</span></h3>' +
      '<p>'+esc(t("found", r.found, r.total) + (r.wrong ? t("wrongMarked", r.wrong) : ""))+'</p></div>' + nextBtn();
  }
  return h + '</section>';
}

function viewChoose(){
  var it = ROUNDS[2].items[S.idx], LT = ["A","B","C"], h = '<section class="card" aria-labelledby="mh">' + progress();
  h += '<h2 id="mh" tabindex="-1">'+esc(t("chooseH"))+'</h2><p class="lead">'+esc(L(it.q))+'</p><div class="opts">';
  it.opts.forEach(function(o,i){
    var cls = "opt", tag = "";
    if(S.answered){
      if(o.best){ cls += " best"; tag = '<span class="tag">'+esc(t("bestAns") + (S.res.pick===i ? " " + t("yourChoiceParen") : ""))+'</span>'; }
      else if(S.res.pick === i){ cls += " wrong"; tag = '<span class="tag">'+esc(t("yourChoice"))+'</span>'; }
    }
    h += '<button type="button" class="'+cls+'" data-act="choose" data-i="'+i+'"'+(S.answered?' disabled':'')+'><span class="ltr" aria-hidden="true">'+LT[i]+'</span><span class="txt">'+tag+'<span>'+esc(L(o.t))+'</span></span></button>';
  });
  h += '</div>';
  if(S.answered){
    var ok = S.res.ok, best = it.opts.filter(function(o){return o.best;})[0], mine = it.opts[S.res.pick];
    h += '<div class="fb '+(ok?'ok':'no')+'" role="status"><h3 id="fbh" tabindex="-1">'+esc(t(ok?"correct":"nq2"))+' <span class="pts">'+esc(t("plus", ok?10:0))+'</span></h3>' +
      (ok?'':'<p><b>'+esc(t("whyRisky"))+'</b> '+esc(L(mine.why))+'</p>') + '<p><b>'+esc(t("whyBest"))+'</b> '+esc(L(best.why))+'</p></div>' + nextBtn();
  }
  return h + '</section>';
}

function stars(n){
  var h = '<div class="stars" role="img" aria-label="'+esc(t("starsAria", n))+'">';
  for(var i=0;i<3;i++){ h += '<svg viewBox="0 0 24 24" aria-hidden="true"><path class="'+(i<n?'star-on':'star-off')+'" d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.3 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z"/></svg>'; }
  return h + '</div>';
}
function viewRoundEnd(){
  var r = ROUNDS[S.round], pts = S.rs[S.round], pct = pts / r.max, n = pct >= .8 ? 3 : (pct >= .5 ? 2 : 1);
  var last = S.round === 2;
  return '<section class="card"><h4>'+esc(t("roundDone", S.round+1))+'</h4><h2 id="mh" tabindex="-1">'+esc(L(r.name))+'</h2>' + stars(n) +
    '<p class="big">'+pts+' <span class="muted" style="font-size:1.1rem;font-family:var(--body)">'+esc(t("ofPts", r.max))+'</span></p>' +
    '<div class="help"><h4>'+esc(t("remember"))+'</h4><p class="lead">'+esc(L(r.remember))+'</p></div>' +
    '<button class="btn" type="button" data-act="after">'+esc(t(last?"seeResults":"playGame"))+'</button></section>';
}

/* ----- mini games ----- */
function initGame(n){
  var g = {n:n, tries:0, msg:"", done:false, stars:3, timer:null};
  if(n === 0){
    var idx = [0,1,2], ord = shuffle(idx), tries = 0;
    while(ord.join() === idx.join() && tries++ < 10){ ord = shuffle(idx); }
    g.selL = null; g.order = ord; g.matched = [];
  } else {
    var cards = [];
    G2.forEach(function(p,i){ cards.push({p:i,s:0},{p:i,s:1}); });
    g.cards = shuffle(cards); g.open = []; g.matchedP = []; g.pending = false;
  }
  return g;
}
function gameCount(){ return S.g.n === 0 ? S.g.matched.length : S.g.matchedP.length; }
function gameTotal(){ return S.g.n === 0 ? G1.length : G2.length; }
function finishGame(){
  var g = S.g; g.done = true;
  var tr = g.tries;
  g.stars = g.n === 0 ? (tr <= 4 ? 3 : (tr <= 6 ? 2 : 1)) : (tr <= 7 ? 3 : (tr <= 11 ? 2 : 1));
  if(!S.bonusDone[g.n]){ S.bonusDone[g.n] = true; S.score += 10; }
}
function gameMatch(){
  var g = S.g, h = "";
  h += '<div class="mcols"><div class="mcol"><h4>'+esc(t("colA"))+'</h4>';
  G1.forEach(function(p,i){
    var m = g.matched.indexOf(i) > -1, cls = "mt" + (m ? " done" : (g.selL === i ? " sel" : ""));
    h += '<button type="button" class="'+cls+'" data-act="mleft" data-i="'+i+'"'+(m||g.done?' disabled':'')+' aria-pressed="'+(g.selL===i)+'"><span>'+esc(L(p.a))+'</span>'+(m?'<span class="ok">✔</span>':'')+'</button>';
  });
  h += '</div><div class="mcol"><h4>'+esc(t("colB"))+'</h4>';
  g.order.forEach(function(k){
    var m = g.matched.indexOf(k) > -1, cls = "mt" + (m ? " done" : "");
    h += '<button type="button" class="'+cls+'" data-act="mright" data-i="'+k+'"'+(m||g.done?' disabled':'')+'><span>'+esc(L(G1[k].b))+'</span>'+(m?'<span class="ok">✔</span>':'')+'</button>';
  });
  return h + '</div></div>';
}
function gameFlip(){
  var g = S.g, h = '<div class="cards">';
  g.cards.forEach(function(c,i){
    var matched = g.matchedP.indexOf(c.p) > -1, up = g.open.indexOf(i) > -1;
    var pair = G2[c.p], txt = L(c.s === 0 ? pair.a : pair.b);
    if(matched){
      h += '<button type="button" class="fc done" disabled><span>'+esc(txt)+'<span class="ok">✔</span></span></button>';
    } else if(up){
      h += '<button type="button" class="fc up'+(c.s?' b':'')+'" data-act="flip" data-i="'+i+'"><span>'+esc(txt)+'</span></button>';
    } else {
      h += '<button type="button" class="fc" data-act="flip" data-i="'+i+'" aria-label="'+esc(t("cardDown", i+1))+'"><span class="q" aria-hidden="true">?</span></button>';
    }
  });
  return h + '</div>';
}
function viewGame(){
  var g = S.g, n = g.n;
  var h = '<section class="card" aria-labelledby="mh"><h4>'+esc(t("gameTag", n+1) + " · " + t(n ? "lvl2" : "lvl1"))+'</h4>' +
    '<h2 id="mh" tabindex="-1">'+esc(t(n ? "g2t" : "g1t"))+'</h2><p class="lead">'+esc(t(n ? "g2i" : "g1i"))+'</p>' +
    '<div class="status"><span class="chip">'+esc(t("tries", g.tries))+'</span><span class="chip">'+esc(t("matchedOf", gameCount(), gameTotal()))+'</span></div>' +
    '<p class="gmsg" role="status">'+esc(g.msg ? t(g.msg) : "")+'</p>';
  h += n ? gameFlip() : gameMatch();
  if(g.done){
    h += '<div class="fb ok" role="status"><h3 id="fbh" tabindex="-1">'+esc(t("gameDone"))+'</h3><p>'+esc(t("doneTries", g.tries))+'</p>'+stars(g.stars)+'</div>' +
      '<button class="btn" type="button" data-act="afterGame">'+esc(t("goRound", n+2))+'</button>';
  } else {
    h += '<button class="btn alt" type="button" data-act="afterGame">'+esc(t("skipGame"))+'</button>';
  }
  return h + '</section>';
}

function viewResults(){
  var p = S.score / MAXPTS, title, note;
  if(p >= .9){ title = "tChamp"; note = "nChamp"; }
  else if(p >= .7){ title = "tGuard"; note = "nGuard"; }
  else if(p >= .5){ title = "tAppr"; note = "nAppr"; }
  else { title = "tFresh"; note = "nFresh"; }
  var B = [
    {k:"b1", on:S.rs[0] >= 40}, {k:"b2", on:S.rs[1] >= 30}, {k:"b3", on:S.rs[2] >= 30},
    {k:"b4", on:S.bonusDone[0] && S.bonusDone[1]}, {k:"b5", on:S.score === MAXPTS}
  ];
  var h = '<section class="card"><div class="rank"><div>'+shieldBig(p,"cpRes")+'</div><div style="display:flex;flex-direction:column;gap:.4rem">' +
    '<h4>'+esc(t("yourTitle"))+'</h4><h2 id="mh" tabindex="-1">'+esc(t(title))+'</h2><p class="big">'+S.score+' <span class="muted" style="font-size:1.1rem;font-family:var(--body)">'+esc(t("ofPts", MAXPTS))+'</span></p><p>'+esc(t(note))+'</p></div></div></section>';
  h += '<section class="card"><h3>'+esc(t("yourBadges"))+'</h3><div class="badges">' + B.map(function(b){
    return '<div class="badge '+(b.on?'on':'off')+'"><b>'+esc(t(b.k))+'</b><span class="muted">'+esc(t(b.k+"d"))+'</span><span class="st">'+esc(t(b.on?"earned":"notYet"))+'</span></div>';
  }).join("") + '</div>' + (S.bestStreak>=2 ? '<p class="muted">'+esc(t("longest", S.bestStreak))+'</p>' : '') + '</section>';
  h += '<section class="card"><h3>'+esc(t("rulesH"))+'</h3><div class="rules">' +
    '<div class="rule"><b>'+esc(t("rStop"))+'</b><span>'+esc(t("rStopT"))+'</span></div>' +
    '<div class="rule"><b>'+esc(t("rCheck"))+'</b><span>'+esc(t("rCheckT"))+'</span></div>' +
    '<div class="rule"><b>'+esc(t("rTell"))+'</b><span>'+esc(t("rTellT"))+'</span></div></div></section>';
  var seen = {}, ms = S.missed.filter(function(m){ if(seen[m.o[0]]) return false; seen[m.o[0]] = 1; return true; });
  if(ms.length){
    h += '<section class="card"><h3>'+esc(t("revisit"))+'</h3><ul>' + ms.map(function(m){return '<li>'+esc((m.flag ? t("flagPrefix") : "") + L(m.o))+'</li>';}).join("") + '</ul></section>';
  }
  h += '<section class="help"><h3>'+esc(t("helpH"))+'</h3><p>'+esc(t("helpP1"))+'</p><p class="num">1799</p>' +
    '<p>'+esc(t("helpP2"))+'</p>' +
    '<p><a href="https://scamshield.gov.sg/scamshield-helpline" target="_blank" rel="noopener">'+esc(t("helpLink"))+'</a></p></section>';
  h += '<section class="card"><h3>'+esc(t("missionH"))+'</h3><p class="lead">'+esc(t("missionA"))+' <b>'+esc(t("missionB"))+'</b></p>' +
    '<div class="row"><button class="btn" type="button" data-act="again">'+esc(t("again"))+'</button></div></section>';
  return h;
}

/* ---------- render ---------- */
function render(){
  var sc = S.screen, h;
  if(sc === "start") h = viewStart();
  else if(sc === "intro") h = viewIntro();
  else if(sc === "q") h = S.round === 0 ? viewJudge() : (S.round === 1 ? viewFlags() : viewChoose());
  else if(sc === "end") h = viewRoundEnd();
  else if(sc === "game") h = viewGame();
  else h = viewResults();
  app.innerHTML = h;
  updateHeader();
  animateBig();
}
function focusTop(){
  var el = document.getElementById("mh"); if(el){ el.focus({preventScroll:true}); }
  window.scrollTo(0, 0);
}
function focusFeedback(){
  var el = document.getElementById("fbh");
  if(el){ el.focus({preventScroll:true}); el.scrollIntoView({behavior: reduce ? "auto" : "smooth", block:"center"}); }
}
function refocus(act, i){
  var y = window.scrollY, el = app.querySelector('[data-act="'+act+'"][data-i="'+i+'"]');
  if(el && !el.disabled){ el.focus({preventScroll:true}); }
  window.scrollTo(0, y);
}
function addScore(pts, good, missed){
  S.score += pts; S.rs[S.round] += pts;
  if(good){ S.streak++; if(S.streak > S.bestStreak) S.bestStreak = S.streak; } else { S.streak = 0; if(missed) S.missed.push(missed); }
}

/* ---------- language + text size ---------- */
function setLang(i){
  li = Math.max(0, Math.min(2, i));
  document.documentElement.lang = LANGS[li];
  try{ localStorage.setItem("scamSpottersLang", String(li)); }catch(e){}
}
try{
  var sl = localStorage.getItem("scamSpottersLang");
  if(sl !== null){ li = parseInt(sl,10) || 0; }
  else if(navigator.language){ var nl = navigator.language.toLowerCase(); li = nl.indexOf("zh") === 0 ? 1 : (nl.indexOf("ms") === 0 ? 2 : 0); }
}catch(e){}
document.documentElement.lang = LANGS[li];

var scales = [0.9, 1, 1.15, 1.3], si = 1;
function setScale(i){
  si = Math.max(0, Math.min(scales.length-1, i));
  document.documentElement.style.setProperty("--scale", scales[si]);
  try{ localStorage.setItem("scamSpottersSize", String(si)); }catch(e){}
}
try{ var saved = localStorage.getItem("scamSpottersSize"); if(saved !== null) setScale(parseInt(saved,10) || 1); }catch(e){}

/* ---------- actions ---------- */
document.addEventListener("click", function(e){
  var b = e.target.closest("[data-act]"); if(!b) return;
  var a = b.getAttribute("data-act");
  if(a === "smaller"){ setScale(si-1); return; }
  if(a === "larger"){ setScale(si+1); return; }
  if(a === "lang"){
    setLang(parseInt(b.getAttribute("data-v"),10)); render();
    var again0 = document.querySelector('[data-act="lang"][data-v="'+li+'"]'); if(again0){ again0.focus({preventScroll:true}); }
    return;
  }
  var r = ROUNDS[S.round], g = S.g;

  if(a === "begin"){ S.screen = "intro"; render(); focusTop(); }
  else if(a === "go"){ S.screen = "q"; S.idx = 0; S.answered = false; S.picks = []; S.res = null; render(); focusTop(); }
  else if(a === "judge"){
    if(S.answered) return;
    var it = r.items[S.idx], v = b.getAttribute("data-v"), ok = v === it.answer;
    S.res = {ok:ok, pick:v}; S.answered = true;
    addScore(ok ? 10 : 0, ok, {o:it.lesson}); render(); focusFeedback();
  }
  else if(a === "toggle"){
    if(S.answered) return;
    var i = parseInt(b.getAttribute("data-i"),10), k = S.picks.indexOf(i);
    if(k > -1) S.picks.splice(k,1); else S.picks.push(i);
    var y = window.scrollY; render(); window.scrollTo(0, y);
    var again = app.querySelector('[data-act="toggle"][data-i="'+i+'"]'); if(again) again.focus({preventScroll:true});
  }
  else if(a === "check"){
    if(S.answered) return;
    var m = r.items[S.idx], found = 0, wrong = 0, total = 0, firstMiss = null;
    m.lines.forEach(function(l,i){
      var on = S.picks.indexOf(i) > -1;
      if(l.f){ total++; if(on) found++; else if(!firstMiss) firstMiss = l.why; }
      else if(on) wrong++;
    });
    var pts = Math.max(0, found*5 - wrong*3);
    S.res = {pts:pts, found:found, wrong:wrong, total:total}; S.answered = true;
    addScore(pts, pts >= 15, firstMiss ? {o:firstMiss, flag:true} : null);
    render(); focusFeedback();
  }
  else if(a === "choose"){
    if(S.answered) return;
    var q = r.items[S.idx], c = parseInt(b.getAttribute("data-i"),10), okc = !!q.opts[c].best;
    S.res = {ok:okc, pick:c}; S.answered = true;
    addScore(okc ? 10 : 0, okc, {o:q.lesson}); render(); focusFeedback();
  }
  else if(a === "next"){
    if(S.idx >= r.items.length - 1){ S.screen = "end"; }
    else { S.idx++; S.answered = false; S.picks = []; S.res = null; }
    render(); focusTop();
  }
  else if(a === "after"){
    if(S.round >= 2){ S.screen = "results"; }
    else { S.screen = "game"; S.g = initGame(S.round); }
    render(); focusTop();
  }
  /* mini game 1: match it */
  else if(a === "mleft"){
    if(!g || g.done) return;
    var li0 = parseInt(b.getAttribute("data-i"),10);
    if(g.matched.indexOf(li0) > -1) return;
    g.selL = li0; g.msg = "";
    render(); refocus("mleft", li0);
  }
  else if(a === "mright"){
    if(!g || g.done) return;
    var kk = parseInt(b.getAttribute("data-i"),10);
    if(g.selL === null){ g.msg = "pickLeft"; render(); refocus("mright", kk); return; }
    g.tries++;
    if(kk === g.selL){ g.matched.push(kk); g.msg = "goodMatch"; } else { g.msg = "tryAgain"; }
    g.selL = null;
    if(g.matched.length === G1.length){ finishGame(); g.msg = ""; render(); focusFeedback(); }
    else { render(); refocus("mright", kk); }
  }
  /* mini game 2: flip and match */
  else if(a === "flip"){
    if(!g || g.done) return;
    var ci = parseInt(b.getAttribute("data-i"),10);
    if(g.pending){ if(g.timer){ clearTimeout(g.timer); } g.open = []; g.pending = false; }
    if(g.open.indexOf(ci) > -1 || g.matchedP.indexOf(g.cards[ci].p) > -1) { render(); return; }
    g.open.push(ci); g.msg = "";
    if(g.open.length === 2){
      g.tries++;
      var c1 = g.cards[g.open[0]], c2 = g.cards[g.open[1]];
      if(c1.p === c2.p){
        g.matchedP.push(c1.p); g.open = []; g.msg = "goodMatch";
        if(g.matchedP.length === G2.length){ finishGame(); g.msg = ""; render(); focusFeedback(); return; }
      } else {
        g.msg = "tryAgain"; g.pending = true;
        g.timer = setTimeout(function(){
          if(S.screen === "game" && S.g === g && g.pending){ g.open = []; g.pending = false; render(); }
        }, 1800);
      }
    }
    render(); refocus("flip", ci);
  }
  else if(a === "afterGame"){
    if(g && g.timer){ clearTimeout(g.timer); }
    S.g = null; S.round++; S.screen = "intro"; S.streak = 0;
    render(); focusTop();
  }
  else if(a === "again"){ fresh(); render(); focusTop(); }
});

render();
})();
</script>

</body></html>
